name: Supabase keep-alive

# Supabase pauses a free project after seven days without enough activity,
# and a paused project gets permanently frozen a few months later. Ronki was
# paused around 25 May 2026 and frozen around 23 August.
#
# The first version of this workflow pinged once a week. That was not
# enough: the scheduled run on 21 Sep 2026 answered 200, Supabase still
# warned on 22 Sep and paused the project on 23 Sep. One call a week does not
# count as "sufficient activity".
#
# So now it runs every day and calls two different public read only RPCs.
# Decision (Marc, 25 Sep 2026): if Supabase sends another pause warning
# within three weeks of this change, move the project to Pro instead.
# If either call stops returning 200 the job goes red.

on:
  schedule:
    # Every day at 06:17 UTC. Odd minute on purpose: GitHub's scheduler
    # queues behind everyone who picked the top of the hour.
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Call leads_count and waitlist_count, require HTTP 200
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing repository secrets VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY."
            exit 1
          fi

          failed=0
          for rpc in leads_count waitlist_count; do
            status=$(curl --silent --show-error --location \
              --max-time 30 \
              --output "response-${rpc}.json" \
              --write-out '%{http_code}' \
              --request POST "${SUPABASE_URL%/}/rest/v1/rpc/${rpc}" \
              --header "apikey: ${SUPABASE_ANON_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              --header "Content-Type: application/json" \
              --data '{}')

            echo "${rpc}: HTTP ${status}, response $(cat "response-${rpc}.json")"
            if [ "$status" != "200" ]; then
              failed=1
            fi
          done

          if [ "$failed" != "0" ]; then
            echo "Keep-alive failed. The Supabase project may be paused, frozen, or the secrets may be stale."
            exit 1
          fi

          echo "Supabase answered both calls."
